site_name: VideoAsCode
site_description: Convert Marp presentations to videos with AI voiceovers
site_url: https://grokify.github.io/videoascode
repo_url: https://github.com/grokify/videoascode
repo_name: grokify/videoascode

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: guides/getting-started/installation.md
    - Quick Start: guides/getting-started/quick-start.md
    - Requirements: guides/getting-started/requirements.md
  - User Guide:
    - Complete Workflow: guides/complete-workflow.md
    - Pipeline Overview: guides/pipeline.md
    - Voiceover Formats: guides/voiceover-formats.md
    - Browser Video Recording: guides/browser-video.md
    - HTML Slide Decks: guides/html-decks.md
    - Lessons and Courses: guides/lessons.md
    - Avatar Presenter Overlay: guides/avatar-presenter.md
    - Subtitle Generation: guides/subtitles.md
    - Pronunciation: guides/pronunciation.md
    - Local Providers (Offline TTS/STT): guides/local-providers.md
    - Multi-Language Support: guides/multi-language.md
    - Output Options: guides/output-options.md
    - Customization: guides/customization.md
    - Troubleshooting: guides/troubleshooting.md
    - Contributing: guides/contributing.md
  - Reference:
    - CLI Reference: guides/reference/cli.md
    - Transcript Schema: guides/reference/transcript-schema.md
    - Voice Settings: guides/reference/voice-settings.md
  - Examples:
    - Overview: guides/examples/index.md
    - Intro Presentation: guides/examples/intro.md
    - HTML Deck: guides/examples/html-deck.md
    - Local Avatar (Offline): guides/examples/local-avatar.md
  - Comparisons:
    - vs marptalk: guides/comparisons/marptalk.md
  - Design:
    - Overview: design/index.md
    - Architecture: design/architecture/overview.md
  - Releases:
    - v0.10.0: releases/v0.10.0.md
    - v0.9.0: releases/v0.9.0.md
    - v0.8.0: releases/v0.8.0.md
    - v0.7.0: releases/v0.7.0.md
    - v0.6.0: releases/v0.6.0.md
    - v0.5.0: releases/v0.5.0.md
    - v0.4.0: releases/v0.4.0.md
    - v0.3.0: releases/v0.3.0.md
    - v0.2.0: releases/v0.2.0.md
    - v0.1.0: releases/v0.1.0.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grokify/videoascode
